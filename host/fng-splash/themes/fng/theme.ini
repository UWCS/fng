[branding]
title = FNG Container
subtitle = University of Warwick Computing Society

[animation]
intro_hold = 0.3
intro_morph = 0.5
duration = 2
radius = 12
spacing = 25
# nicked from stardust
points = 0 -2.619047619 #FFC700; -1.714285714 -0.904761905 #FFC700; 0 0.904761905 #3A7DFF; 1.714285714 2.619047619 #3A7DFF
# clockwise from TL
ring_order = 2 0 3 1
speed_min = 1
speed_max = 5
speed_change_min_s = 0.5
speed_change_max_s = 2
dot_scale_wobble = 0.5

[rendering]
fps = 60

[background]
base_colour = #15132d
hotspots = #7549ec, #3a62cf, #287bbb, #9a45aa
speed = 0.4
wave_strength = 0.4
vignette = true
fps = 60
resolution = 512

[progress]
corner_radius = 8
track_colour = rgba(10,12,30,0.65)
pulse = true
wave = true
gradient_speed = 0.3
segment = 0.2
period = 1.5

[diagnostics]
hint = Press Esc to show diagnostic logs
verbose_hint = Press Esc to return to the splash

[footer]
text = Original project by <span foreground="#b8ceff">Alex Wright</span> · remake by <span foreground="#b8ceff">Raven</span> · maintained by <span foreground="#b8ceff">UWCS Tech Team</span>
